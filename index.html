<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Dose Cafe Iraq">
<meta property="og:description" content="من الشجرة إلى فنجانك — منيو دوز كافيه">
<meta property="og:image" content="cup.jpg">
<link rel="icon" href="logo.webp">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
</head>
<body>
<title>Dose Cafe Iraq</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600&family=Outfit:wght@200;300;400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pinned full-bleed film (generated footage) scrubbed by scroll, chapter copy over the dark negative space,
   then menu chapters: a photo held on one side, the items assembling beside it. Single dark look on purpose. */
:root{
  color-scheme: dark;
  --roast:#0f0907; --roast-2:#1a110c; --line:rgba(240,227,208,.13);
  --crema:#f2e6d4; --crema-dim:#b3a08a; --dose:#d84823; --caramel:#e0a25a;
  --f-ar:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-en:"Outfit","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Outfit",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{background:var(--roast)}
body{background:var(--roast);color:var(--crema);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
.disp{font-family:var(--f-ar);font-weight:500}
html[lang="en"] .disp{font-family:var(--f-en);font-weight:200;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:2px solid var(--caramel);outline-offset:3px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--roast)}

/* header */
.top{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:14px;padding-left:var(--gl);padding-right:var(--gr);transition:background .35s}
.top.solid{background:rgba(15,9,7,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand img{display:block;width:78px;border-radius:3px}
.top nav{display:flex;align-items:center;gap:4px}
.top nav a{font-size:14px;text-decoration:none;color:var(--crema-dim);padding:8px 12px}
.top nav a:hover{color:var(--crema)}
.lang{font:500 13px/1 var(--f-mono);color:var(--crema);background:rgba(15,9,7,.35);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;letter-spacing:.06em}

/* film */
#story{position:relative;height:880vh}
.film{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#0b0705}
.film video,.film .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.film .poster{transition:opacity .6s}
.shade{position:absolute;inset:0;pointer-events:none}
html[dir="rtl"] .shade{background:linear-gradient(270deg,rgba(11,7,5,.86) 0%,rgba(11,7,5,.45) 32%,transparent 55%),linear-gradient(0deg,rgba(11,7,5,.7),transparent 30%)}
html[dir="ltr"] .shade{background:linear-gradient(90deg,rgba(11,7,5,.86) 0%,rgba(11,7,5,.45) 32%,transparent 55%),linear-gradient(0deg,rgba(11,7,5,.7),transparent 30%)}
.copy{position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(560px,46%);display:flex;align-items:center;
  padding-left:var(--gl);padding-right:var(--gr);padding-inline-start:max(var(--gl),5vw)}
.panel{position:absolute;inset-inline:max(16px,5vw) 0;opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.panel.on{opacity:1;transform:none}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.24em;color:var(--caramel);display:flex;gap:12px;align-items:center;text-transform:uppercase}
.eyebrow b{color:var(--dose);font-weight:500}
.panel h1,.panel h2{margin:16px 0 14px;font-size:clamp(42px,6.2vw,92px);line-height:1.02;text-wrap:balance}
.panel h2{font-size:clamp(38px,5vw,74px)}
.panel p{margin:0;max-width:40ch;color:var(--crema-dim);font-size:clamp(15px,1.2vw,18px)}
.read{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px 22px;border-top:1px solid var(--line);padding-top:14px;font:500 12px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--crema-dim)}
.read span{white-space:nowrap;display:flex;flex-direction:column;gap:6px}
.read em{font-style:normal;color:var(--crema);font-size:22px;letter-spacing:0;font-variant-numeric:tabular-nums}
.rail{position:absolute;inset-inline-end:var(--gr);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:2}
.rail i{display:block;width:2px;height:26px;background:rgba(240,227,208,.18);border-radius:2px;overflow:hidden;position:relative}
.rail i b{position:absolute;inset:0;background:var(--dose);transform:scaleY(var(--p,0));transform-origin:top}
.loader{position:absolute;inset-inline-start:max(var(--gl),5vw);bottom:28px;font:500 11px/1 var(--f-mono);letter-spacing:.2em;color:var(--crema-dim);display:flex;align-items:center;gap:12px}
.loader i{width:120px;height:1px;background:rgba(240,227,208,.2);position:relative}
.loader i b{position:absolute;inset:0;background:var(--dose);transform-origin:left;transform:scaleX(var(--l,0))}
html[dir="rtl"] .loader i b{transform-origin:right}
.hint{margin-top:30px;display:flex;align-items:center;gap:12px;font:500 11px/1 var(--f-mono);letter-spacing:.2em;color:var(--crema-dim)}
.hint i{width:1px;height:44px;background:linear-gradient(var(--dose),transparent);animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (max-width:820px){
  .copy{width:100%;align-items:flex-end;padding-bottom:max(34px,env(safe-area-inset-bottom));inset-inline-start:0}
  .panel{inset-inline:var(--gl) var(--gr);bottom:max(34px,env(safe-area-inset-bottom))}
  html[dir] .shade{background:linear-gradient(0deg,rgba(11,7,5,.95) 0%,rgba(11,7,5,.7) 34%,transparent 62%),linear-gradient(180deg,rgba(11,7,5,.55),transparent 18%)}
  .panel h1{font-size:clamp(38px,11vw,54px)} .panel h2{font-size:clamp(34px,10vw,48px);margin:10px 0 8px}
  .panel p{font-size:15px} .read{margin-top:14px} .read em{font-size:19px}
  .rail{top:auto;bottom:auto;top:84px;transform:none;flex-direction:row;inset-inline:var(--gl) var(--gr);gap:6px}
  .rail i{height:2px;flex:1;width:auto}
  .rail i b{transform:scaleX(var(--p,0));transform-origin:left}
  html[dir="rtl"] .rail i b{transform-origin:right}
  .loader{bottom:auto;top:100px}
}

/* menu */
#menu{position:relative;padding-bottom:90px;background:var(--roast)}
.mhead{position:relative;min-height:62vh;display:flex;align-items:flex-end;justify-content:center;text-align:center;overflow:hidden;
  padding-left:var(--gl);padding-right:var(--gr);padding-block:120px 40px}
.mhead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.mhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--roast) 0%,transparent 35%,transparent 55%,var(--roast) 100%)}
.mhead > div{position:relative;z-index:1}
.mhead h2{margin:12px 0 8px;font-size:clamp(56px,10vw,132px);line-height:.95}
.mhead p{margin:0 auto;color:var(--crema-dim);max-width:44ch}
.search{margin:24px auto 0;max-width:420px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;color:var(--crema);background:rgba(26,17,12,.8);border:1px solid var(--line);border-radius:999px;padding:12px 44px}
.search input::placeholder{color:var(--crema-dim)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:16px;width:18px;height:18px;stroke:var(--crema-dim)}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:40;background:rgba(15,9,7,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.chips-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr);max-width:1280px;margin:0 auto}
.chips-in::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;color:var(--crema-dim);background:transparent;border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--crema)}
.chip.on{color:var(--crema);border-color:var(--dose);background:rgba(216,72,35,.12)}

.chapters{max-width:1280px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.ch{padding-top:64px;scroll-margin-top:120px}
.ch-head{position:relative;border-radius:22px;overflow:hidden;height:clamp(150px,22vw,260px);display:flex;align-items:flex-end;margin-bottom:22px;background:var(--roast-2)}
.ch-head img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;transform:scale(1.12);filter:brightness(.55);transition:transform 2.4s cubic-bezier(.2,.8,.2,1),filter 1.6s}
.ch.seen .ch-head img{transform:scale(1);filter:brightness(.72)}
.ch-head::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,7,5,.85),transparent 60%)}
.ch-head div{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;width:100%;padding:20px 24px}
.ch-head h3{margin:0;font-size:clamp(32px,4.4vw,58px);line-height:1}
.ch-head span{font:500 11px/1 var(--f-mono);letter-spacing:.16em;color:var(--crema);opacity:.85;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.it{position:relative;display:flex;flex-direction:column;background:var(--roast-2);border-radius:18px;overflow:hidden;cursor:pointer;min-width:0;
  border:1px solid transparent;transition:border-color .25s, transform .3s}
.it:hover{border-color:rgba(216,72,35,.45);transform:translateY(-3px)}
.it .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#140c08}
.it .ph img{width:100%;height:100%;object-fit:cover;display:block;clip-path:inset(100% 0 0 0);transform:scale(1.18);
  transition:clip-path 1.1s cubic-bezier(.7,0,.2,1), transform 1.8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.it.in .ph img{clip-path:inset(0 0 0 0);transform:scale(1)}
.it:hover .ph img{transform:scale(1.05)}
.it .ph::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--dose);transform:scaleX(0);transform-origin:center;transition:transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0s) + .55s)}
.it.in .ph::after{transform:scaleX(1)}
.it .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1;opacity:0;transform:translateY(12px);transition:opacity .6s, transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0s) + .45s)}
.it.in .tx{opacity:1;transform:none}
.it h4{margin:0;font-size:18px;font-weight:600;line-height:1.3}
html[lang="en"] .it h4{font-family:var(--f-en);font-weight:400}
.it .d{margin:0;font-size:13.5px;color:var(--crema-dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{margin-top:auto;padding-top:10px;display:flex;gap:16px;flex-wrap:wrap;font:500 14px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.it .pr small{font:400 11px/1 var(--f-body);color:var(--crema-dim);margin-inline-end:5px}
.it .pr .cur{color:var(--caramel);font-size:11px;margin-inline-start:4px}
.empty{padding:40px 0;text-align:center;color:var(--crema-dim)}
@media (max-width:620px){
  .ch{padding-top:40px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .it .tx{padding:10px 11px 12px}
  .it h4{font-size:15px}
  .it .d{display:none}
  .it .pr{gap:4px 10px;font-size:12.5px;padding-top:6px}
}
@media (prefers-reduced-motion: reduce){.it .ph img,.it .tx,.it .ph::after{transition:none}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,3,2,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet-in{position:relative;width:min(560px,100%);max-height:92svh;overflow:auto;background:var(--roast-2);border:1px solid var(--line);border-radius:26px 26px 0 0;transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open .sheet-in{transform:none}
@media (min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:26px}}
.sh-img{position:relative;aspect-ratio:16/10;overflow:hidden}
.sh-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
.sheet.open .sh-img img{transform:none}
.sh-img::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--roast-2),transparent 55%)}
.sh-body{padding:0 22px calc(26px + env(safe-area-inset-bottom,0px));margin-top:-40px;position:relative}
.sheet .x{position:absolute;top:14px;inset-inline-end:14px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(15,9,7,.6);color:var(--crema);font-size:20px;cursor:pointer}
.sheet h3{margin:0 0 4px;font-size:34px;line-height:1.1}
.sheet .alt{margin:0;font:400 13px/1.4 var(--f-mono);color:var(--crema-dim)}
.ings{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;padding:0;list-style:none}
.ings li{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;transition-delay:var(--d,0s)}
.sheet.open .ings li{opacity:1;transform:none}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.size{flex:1 1 140px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.size span{color:var(--crema-dim);font-size:14px}
.size b{font:500 18px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.size small{color:var(--caramel);font-size:11px}

footer{border-top:1px solid var(--line);padding-block:44px 54px;padding-left:var(--gl);padding-right:var(--gr)}
.foot{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end}
.foot img{width:96px;border-radius:3px;display:block}
.foot p{margin:10px 0 0;color:var(--crema-dim);font-size:14px}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--crema-dim)}
.soc a:hover{color:var(--crema);border-color:var(--dose)}
@media (prefers-reduced-motion: reduce){
  .panel,.it,.ch-photo img,.ings li{transition:none}
  .hint i{animation:none}
}
</style>

<header class="top" id="top">
  <a class="brand" href="#story" aria-label="Dose Cafe Iraq"><img src="logo.webp" alt="Dose Cafe Iraq" width="78" height="52"></a>
  <nav>
    <a href="#story" data-t="navStory">القصة</a>
    <a href="#menu" data-t="navMenu">المنيو</a>
    <button class="lang" id="lang" type="button" aria-label="Switch language">EN</button>
  </nav>
</header>

<section id="story">
  <div class="film" id="film">
    <img class="poster" id="poster" src="poster.jpg" alt="">
    <video id="vid" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="shade"></div>
    <div class="copy" id="copy"></div>
    <div class="rail" id="rail"></div>
    <div class="loader" id="loader"><span data-t="loading">تحميل</span><i><b></b></i><span id="lp">0%</span></div>
  </div>
</section>

<section id="menu">
  <div class="mhead">
    <img src="cup.jpg" alt="">
    <div>
      <div class="eyebrow" style="justify-content:center"><b>●</b><span>DOSE CAFE IRAQ</span></div>
      <h2 class="disp" data-t="menuTitle">المنيو</h2>
      <p data-t="menuSub">اختار جرعتك. اضغط على أي صنف حتى تشوف مكوناته وأحجامه.</p>
      <div class="search">
        <input id="q" type="search" autocomplete="off" placeholder="ابحث">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </div>
    </div>
  </div>
  <div class="chips"><div class="chips-in" id="chips"></div></div>
  <div class="chapters" id="chapters"></div>
</section>

<footer>
  <div class="foot">
    <div><img src="logo.webp" alt="Dose Cafe Iraq"><p data-t="foot">قهوة مختصة تنعمل قدامك، جرعة بجرعة.</p></div>
    <div class="soc" id="soc"></div>
  </div>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-name">
  <div class="sheet-in">
    <button class="x" id="sh-x" type="button" aria-label="Close">×</button>
    <div class="sh-img"><img id="sh-img" src="" alt=""></div>
    <div class="sh-body">
      <h3 class="disp" id="sh-name"></h3>
      <p class="alt" id="sh-alt"></p>
      <ul class="ings" id="sh-ings"></ul>
      <div class="sizes" id="sh-sizes"></div>
    </div>
  </div>
</div>

<script>
/* Dose Cafe Iraq — menu data (source: dosecafeiraq.com/menu, Nov 2026).
   Item: [nameAr, nameEn, descAr, descEn, price]
   price: "6000/7000" = medium/large · "3000|4000" = single/double · "6000" = one price */
const MENU = [
 {id:"iced", ar:"قهوة باردة", en:"Iced Coffee", vessel:"glass", items:[
  ["كولد برو","Cold Brew","قهوة اثيوبية على طريقة كولد برو","Ethiopian coffee, slow cold-brewed","6000/7000"],

  ["تركش ايس لاتيه","Turkish Iced Latte","خليط الدولتشي + القهوة المختصة بالهيل + قطع الثلج","Dulce blend, cardamom specialty coffee, ice","6000/7000"],
  ["جابانيز ايس لاتيه","Japanese Iced Latte","خليط من ماء الورد و الهيل + سنكل شوت اسبريسو + قطع ثلج","Rosewater & cardamom, single espresso, ice","6000/7000"],
  ["دولتشي ديلتشي ايس لاتيه","Dulce de Leche Iced Latte","خليط الدولتشي (سبانش) + سنكل شوت اسبريسو + قطع ثلج","Spanish dulce blend, single espresso, ice","6500/7500"],
  ["بستاشيو ايس لاتيه","Pistachio Iced Latte","خليط الفستق الحلبي + سنكل شوت اسبريسو + قطع ثلج","Aleppo pistachio blend, single espresso, ice","7000/8000"],
  ["زعفران ايس لاتيه","Saffron Iced Latte","خليط الزعفران الخاص + سنكل شوت اسبريسو + قطع ثلج","House saffron blend, single espresso, ice","6000/7000"],
  ["ايس لاتيه","Iced Latte","حليب + دبل شوت اسبريسو + قطع ثلج","Milk, double espresso, ice","5000/6000"]
 ]},
 {id:"hot", ar:"قهوة حارة", en:"Hot Coffee", vessel:"mug", items:[
  ["هوت جوكليت","Hot Chocolate","الشوكليت الخاص + حليب","House chocolate, milk","5500/6500"],
  ["شاي عراقي","Iraqi Tea","شاي تخدير ذو نكهة خاصة","Slow-steeped tea with a house blend","2000/3000"],
  ["V 60","V60","قهوة مفلترة","Hand-poured filter coffee","6000/7000"],

    p: ["ماء بحرارة 93 درجة وضغط 9 بار لمدة 28 ثانية. انزل للمنيو واختار.", "Water at 93°C and 9 bar for 28 seconds. Scroll on and pick yours."],
    r: [[["الماء", "WATER"], "93°C"], [["الضغط", "PRESSURE"], "9 bar"], [["الاستخلاص", "SHOT"], "0 s", "secs"]] }
];
const img = n => "items/i" + String(n).padStart(3, "0") + ".webp";
const CAT_IMG = { iced: "cat-iced.webp", hot: "cat-hot.webp", refresh: "cat-refresh.webp", fit: "cat-fit.webp", matcha: "cat-matcha.webp", sweets: "cat-sweets.webp", sandwich: "cat-sandwich.webp", merch: "cat-merch.webp" };

const panelInner = s => `
  <div class="eyebrow"><b>${s.n || "●"}</b><span>${L(...s.ey)}</span></div>
  ${s.intro ? `<h1 class="disp">${L(...s.h)}</h1>` : `<h2 class="disp">${L(...s.h)}</h2>`}
  <p>${L(...s.p)}</p>
  ${s.r ? `<div class="read">${s.r.map(r => `<span>${L(...r[0])}<em dir="ltr"${r[2] ? ` id="ro-${r[2]}"` : ""}>${r[1]}</em></span>`).join("")}</div>` : ""}
  ${s.intro ? `<div class="hint"><i></i>${L("مرّر", "SCROLL")}</div>` : ""}`;

function renderCopy() {
  const ps = $$(".panel");
  if (ps.length) ps.forEach((p, i) => (p.innerHTML = panelInner(STEPS[i])));
  else $("#copy").innerHTML = STEPS.map((s, i) => `<div class="panel${i ? "" : " on"}">${panelInner(s)}</div>`).join("");
  if (!$("#rail").childElementCount) $("#rail").innerHTML = STEPS.slice(1).map(() => `<i><b></b></i>`).join("");
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("#lang").textContent = LANG === "ar" ? "EN" : "ع";
  $$("[data-t]").forEach(el => (el.textContent = t(el.dataset.t)));
  $("#q").placeholder = t("search");
}

/* ================= film scrub ================= */
const vid = $("#vid"), story = $("#story");
let dur = 56.3, target = 0, cur = 0, ready = false;
const small = innerWidth < 820 || (navigator.connection && navigator.connection.saveData);
const SRC = small ? "story-sm.mp4" : "story.mp4";

async function loadFilm() {
  const lp = $("#lp"), bar = $("#loader i");
  try {
    const res = await fetch(SRC);
    if (!res.ok || !res.body) throw 0;
    const total = +res.headers.get("content-length") || 0, reader = res.body.getReader(), chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) { const f = got / total; bar.style.setProperty("--l", f); lp.textContent = Math.round(f * 100) + "%"; }
    }
    vid.src = URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
  } catch (e) { vid.src = SRC; }
  vid.addEventListener("loadeddata", () => {
    dur = vid.duration || dur; ready = true;
    $("#poster").style.opacity = 0; $("#loader").style.display = "none";
    vid.play().then(() => vid.pause()).catch(() => {});
  }, { once: true });
  vid.load();
}

function progress() {
  const r = story.getBoundingClientRect(), span = story.offsetHeight - innerHeight;
  return Math.min(1, Math.max(0, -r.top / span));
}
let lastStep = -1;
function onScroll() {
  const p = progress();
  target = p * (dur - 0.05);
  const tm = target;
  let k = 0;
  STEPS.forEach((s, i) => { if (tm >= s.at[0]) k = i; });
  const inWin = tm <= STEPS[k].at[1];
  $$(".panel").forEach((el, i) => el.classList.toggle("on", i === k && inWin));
  if (k !== lastStep) lastStep = k;
  $$("#rail b").forEach((b, i) => {
    const s = STEPS[i + 1], f = (tm - s.at[0]) / (s.at[1] - s.at[0]);
    b.style.setProperty("--p", Math.min(1, Math.max(0, f)));
  });
  const roast = STEPS[3], esp = STEPS[7];
  const rt = Math.min(1, Math.max(0, (tm - roast.at[0]) / (roast.at[1] - roast.at[0])));
  const te = $("#ro-temp"); if (te) te.textContent = Math.round(rt * 205) + "°C";
  const et = Math.min(1, Math.max(0, (tm - esp.at[0]) / 6.5));
  const se = $("#ro-secs"); if (se) se.textContent = Math.round(et * 28) + " s";
  $("#top").classList.toggle("solid", scrollY > story.offsetHeight - innerHeight * 1.1);
}
function tick() {
  cur += (target - cur) * (reduce ? 1 : 0.14);
  if (ready && Math.abs(vid.currentTime - cur) > 0.03 && !vid.seeking) {
    try { vid.currentTime = cur; } catch (e) {}
  }
  requestAnimationFrame(tick);
}

/* ================= menu ================= */
const fmt = v => Number(v).toLocaleString("en-US");
function prices(p) {
  if (p.includes("/")) { const [m, l] = p.split("/"); return [["M", m], ["L", l]]; }
  if (p.includes("|")) { const [s, d] = p.split("|"); return [["S", s], ["D", d]]; }
  return [["one", p]];
}
const countLbl = n => LANG === "ar" ? `${n} ${n >= 3 && n <= 10 ? "أصناف" : "صنف"}` : `${n} ITEMS`;
let io, spy;
function renderMenu() {
  $("#chips").innerHTML = MENU.map((c, i) => `<button class="chip${i ? "" : " on"}" type="button" data-c="${c.id}">${L(c.ar, c.en)}</button>`).join("");
  let off = 0;
  $("#chapters").innerHTML = MENU.map(c => { const base = off; off += c.items.length; return `
    <section class="ch" id="ch-${c.id}" data-c="${c.id}">
      <div class="ch-head"><img src="${CAT_IMG[c.id]}" alt="" loading="lazy"><div><h3 class="disp">${L(c.ar, c.en)}</h3><span>${countLbl(c.items.length)}</span></div></div>
      <div class="grid">${c.items.map((it, j) => `
        <article class="it" tabindex="0" role="button" data-c="${c.id}" data-j="${j}" data-n="${base + j}" data-s="${(it[0] + " " + it[1]).toLowerCase()}" style="--d:${(j % 4) * 0.09}s">
          <div class="ph"><img src="${img(base + j)}" alt="${L(it[0], it[1])}" loading="lazy" width="640" height="478"></div>
          <div class="tx"><h4>${L(it[0], it[1])}</h4>
          ${L(it[2], it[3]) ? `<p class="d">${L(it[2], it[3])}</p>` : ""}
          <div class="pr">${prices(it[4]).map(([k, v]) => `<span>${k === "one" ? "" : `<small>${t(k)}</small>`}${fmt(v)}<span class="cur">${t("cur")}</span></span>`).join("")}</div></div>
        </article>`).join("")}</div>
    </section>`; }).join("") + `<p class="empty" id="empty" hidden>${t("empty")}</p>`;
  $("#soc").innerHTML = SOCIAL.map(s => `<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("");

  io && io.disconnect();
  if (!("IntersectionObserver" in window) || reduce) { $$(".it").forEach(e => e.classList.add("in")); $$(".ch").forEach(e => e.classList.add("seen")); }
  else {
    io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add(e.target.classList.contains("ch") ? "seen" : "in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px", threshold: .12 });
    $$(".it,.ch").forEach(e => io.observe(e));
  }
  spy && spy.disconnect();
  spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      $$(".chip").forEach(b => b.classList.toggle("on", b.dataset.c === e.target.dataset.c));
      const on = $(".chip.on"); on && on.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    }
  }), { rootMargin: "-150px 0px -55% 0px" });
  $$(".ch").forEach(s => spy.observe(s));
}
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); b && $("#ch-" + b.dataset.c).scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); });
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(); let any = false;
  $$(".ch").forEach(sec => {
    let n = 0;
    $$(".it", sec).forEach(it => { const ok = !q || it.dataset.s.includes(q); it.hidden = !ok; if (ok) { n++; it.classList.add("in"); } });
    sec.hidden = !n; any = any || n > 0;
  });
  $("#empty").hidden = any;
});

/* sheet */
const sheet = $("#sheet"); let lastFocus;
function openItem(el) {
  const cat = MENU.find(c => c.id === el.dataset.c), it = cat.items[+el.dataset.j];
  lastFocus = el;
  $("#sh-img").src = img(+el.dataset.n); $("#sh-img").alt = L(it[0], it[1]);
  $("#sh-name").textContent = L(it[0], it[1]);
  $("#sh-alt").textContent = L(it[1], it[0]);
  const parts = (LANG === "ar" ? it[2].split("+") : it[3].split(/,|·/)).map(s => s.trim()).filter(Boolean);
  $("#sh-ings").innerHTML = parts.map((s, i) => `<li style="--d:${(.15 + i * .12).toFixed(2)}s">${s}</li>`).join("");
  $("#sh-sizes").innerHTML = prices(it[4]).map(([k, v]) => `<div class="size"><span>${t(k)}</span><b>${fmt(v)} <small>${t("cur")}</small></b></div>`).join("");
  sheet.classList.add("open"); document.body.style.overflow = "hidden"; $("#sh-x").focus();
}
function closeSheet() { sheet.classList.remove("open"); document.body.style.overflow = ""; lastFocus && lastFocus.focus({ preventScroll: true }); }
$("#chapters").addEventListener("click", e => { const el = e.target.closest(".it"); el && openItem(el); });
$("#chapters").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("it")) { e.preventDefault(); openItem(e.target); } });
$("#sh-x").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });

$("#lang").addEventListener("click", () => {
  LANG = LANG === "ar" ? "en" : "ar";
  try { localStorage.setItem("dose-lang", LANG); } catch (e) {}
  applyLang(); renderCopy(); renderMenu(); onScroll();
});

applyLang(); renderCopy(); renderMenu();
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);
onScroll(); loadFilm(); requestAnimationFrame(tick);
})();

</script>

</body>
</html>
